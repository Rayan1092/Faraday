<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Faraday</title>
  <!-- Fully offline: every asset is served from dashboard/static/. No CDNs, no web fonts. -->
  <link rel="stylesheet" href="/static/dashboard.css">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
</head>
<body data-status="green" data-alert="normal">
  <div id="backdrop" class="backdrop" aria-hidden="true"></div>
  <div class="status-line" aria-hidden="true"></div>
  <div class="edge-glow" aria-hidden="true"></div>

  <div id="toast" class="toast" role="status" aria-live="polite">
    <span class="toast-dot" aria-hidden="true"></span>
    <div class="toast-body">
      <div id="toast-title" class="toast-title"></div>
      <div id="toast-text" class="toast-text"></div>
    </div>
  </div>

  <main class="app">
    <!-- Left: status, messages, rules -->
    <section class="col col-left">
      <div class="glass status-card">
        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="ring-track" cx="60" cy="60" r="52"></circle>
            <circle class="ring-arc" cx="60" cy="60" r="52"></circle>
          </svg>
          <span id="ring-icon" class="ring-icon" data-icon="lock"></span>
        </div>
        <div class="status-text">
          <div class="eyebrow">Faraday</div>
          <h1 id="mode" class="mode">Home</h1>
          <div class="alert-row"><span class="dot" aria-hidden="true"></span><span id="alert">All clear</span></div>
        </div>
        <div class="badges">
          <span class="link-row"><span id="mic-open" class="mic-open" title="The mic is open" hidden><span data-icon="mic"></span></span><span id="link" class="link">connecting…</span></span>
        </div>
      </div>

      <div class="glass list-card notes">
        <div class="card-head"><span data-icon="message"></span><h2 id="notes-title">Messages</h2></div>
        <div id="summary" class="summary" hidden></div>
        <ul id="messages" class="messages"></ul>
      </div>

      <div class="glass list-card rules">
        <div class="card-head"><span data-icon="rule"></span><h2 id="rules-title">Tasks</h2></div>
        <ul id="rules" class="rule-list"></ul>
      </div>
    </section>

    <!-- Center: the live camera (with the detector's boxes), its label, and the conversation -->
    <section class="col col-center">
      <figure class="glass photo-card">
        <div class="photo-frame">
          <img id="live" alt="Live camera" hidden>
          <img id="photo" alt="Latest photo" hidden>
          <span id="live-badge" class="live-badge" hidden><span class="dot" aria-hidden="true"></span>Live</span>
          <div id="photo-empty" class="photo-empty"><span data-icon="camera"></span><span>No photo yet</span></div>
        </div>
        <figcaption class="caption">
          <p id="threat" class="threat" aria-live="polite"></p>
          <div id="chips" class="chips" aria-label="What the camera detected" hidden></div>
          <p id="recording" class="recording" hidden><span class="dot" aria-hidden="true"></span><span id="recording-text">Recording saved</span></p>
          <p id="photo-text" class="caption-text">The camera hasn't taken a photo yet.</p>
          <p class="caption-meta"><span data-icon="camera"></span><span id="photo-meta"></span></p>
        </figcaption>
      </figure>

      <div class="glass talk-card">
        <div class="card-head"><span data-icon="mic"></span><h2>Heard &amp; said</h2></div>
        <ol id="talk" class="talk-list"></ol>
      </div>
    </section>

    <!-- Right: live activity -->
    <section class="col col-right">
      <div class="glass timeline-card">
        <div class="card-head"><span data-icon="activity"></span><h2>Activity</h2></div>
        <ol id="feed" class="timeline"></ol>
      </div>
    </section>

    <!-- Bottom dock: lights, modes, Controls page -->
    <nav class="glass dock" aria-label="Controls">
      <div id="lights" class="lights"></div>

      <div class="segmented" role="group" aria-label="Mode">
        <button id="btn-away" class="seg" type="button" data-mode="away"><span class="seg-dot"></span>Away</button>
        <button id="btn-night" class="seg" type="button" data-mode="night"><span class="seg-dot"></span>Night</button>
        <button id="btn-home" class="seg" type="button" data-mode="home"><span class="seg-dot"></span>Home</button>
      </div>

      <div class="dock-actions">
        <a id="btn-controls" class="pill-btn" href="/controls"><span data-icon="sliders"></span>Controls</a>
      </div>
    </nav>
  </main>

  <!-- Passphrase sheet -->
  <div id="home-dialog" class="sheet-backdrop" hidden>
    <form id="home-form" class="glass sheet" autocomplete="off">
      <span class="sheet-icon" data-icon="lock"></span>
      <h2>Disarm</h2>
      <p>Only the owner can disarm. Enter the passphrase.</p>
      <input id="home-pass" type="password" autocomplete="off" aria-label="Passphrase">
      <p id="home-error" class="error" role="alert"></p>
      <div class="sheet-buttons">
        <button id="home-cancel" class="pill-btn ghost" type="button">Cancel</button>
        <button class="pill-btn primary" type="submit">Disarm</button>
      </div>
    </form>
  </div>

  <script src="/static/icons.js"></script>
  <script src="/static/dashboard.js"></script>
</body>
</html>
